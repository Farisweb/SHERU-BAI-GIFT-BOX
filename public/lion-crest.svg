<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Royal Crest Outer Shield & Gold Rim -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5ECDA"/>
      <stop offset="35%" stop-color="#C6A15B"/>
      <stop offset="70%" stop-color="#8E6F33"/>
      <stop offset="100%" stop-color="#D3B16F"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#681C32"/>
      <stop offset="100%" stop-color="#3F0D1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#30251F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Shield Shape -->
  <path d="M60 6 C78 6 102 12 108 26 C108 62 90 94 60 114 C30 94 12 62 12 26 C18 12 42 6 60 6 Z" 
        fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Gold Filigree Border -->
  <path d="M60 14 C74 14 94 19 98 30 C98 59 84 85 60 102 C36 85 22 59 22 30 C26 19 46 14 60 14 Z" 
        fill="none" stroke="#C6A15B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.8"/>

  <!-- Crown on Shield -->
  <path d="M46 22 L51 32 L60 25 L69 32 L74 22 L71 36 L49 36 Z" fill="url(#goldGrad)" />
  <circle cx="46" cy="21" r="2" fill="#FFF9F0" stroke="#C6A15B" stroke-width="0.8"/>
  <circle cx="60" cy="23" r="2.5" fill="#FFF9F0" stroke="#C6A15B" stroke-width="0.8"/>
  <circle cx="74" cy="21" r="2" fill="#FFF9F0" stroke="#C6A15B" stroke-width="0.8"/>

  <!-- Majestic White Lion Silhouette -->
  <!-- Mane & Head -->
  <path d="M60 38 C52 38 46 44 45 52 C41 53 38 58 39 63 C40 67 43 70 42 74 C41 78 43 83 48 85 C51 86 54 83 57 85 C60 87 63 85 66 84 C71 82 76 84 78 80 C80 76 77 71 80 66 C82 61 80 55 76 52 C75 44 68 38 60 38 Z" 
        fill="#FFFFFF" />
  
  <!-- Royal Details: Eyes, Nose, Muzzle & Mane Locks in Gold/Deep Burgundy -->
  <path d="M50 56 C52 54 55 54 56 57" stroke="#C6A15B" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M70 56 C68 54 65 54 64 57" stroke="#C6A15B" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Lion Nose & Snout -->
  <polygon points="60,63 56,60 64,60" fill="#C6A15B"/>
  <path d="M60 63 L60 68 M60 68 C57 68 55 66 54 64 M60 68 C63 68 65 66 66 64" 
        stroke="#C6A15B" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Whisker Flares & Noble Eyebrows -->
  <circle cx="53" cy="56" r="1.3" fill="#30251F"/>
  <circle cx="67" cy="56" r="1.3" fill="#30251F"/>
  <path d="M49 66 L42 65 M49 68 L43 69" stroke="#C6A15B" stroke-width="1" stroke-linecap="round"/>
  <path d="M71 66 L78 65 M71 68 L77 69" stroke="#C6A15B" stroke-width="1" stroke-linecap="round"/>

  <!-- Mane flowing highlights -->
  <path d="M45 48 C42 45 47 43 49 45 M75 48 C78 45 73 43 71 45" stroke="#C6A15B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M46 75 C48 78 52 79 55 78 M74 75 C72 78 68 79 65 78" stroke="#C6A15B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Star Embellishment below Lion -->
  <polygon points="60,91 62,96 67,96 63,99 65,104 60,101 55,104 57,99 53,96 58,96" fill="url(#goldGrad)" />
</svg>
